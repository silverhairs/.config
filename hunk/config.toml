theme = "gruvbox-auto" # Registered at startup by extensions/gruvbox-auto.ts.
mode = "auto"        # auto, split, stack
vcs = "git"          # git, jj, sl
watch = false
exclude_untracked = false
line_numbers = true
tab_width = 4       # tab stops, 1-16
wrap_lines = false
menu_bar = true
agent_notes = false
prompt_save_view_preferences = true
transparent_background = false

# Custom Gruvbox themes. Press `t` in Hunk to switch between them.
# The built-in bases provide canonical Gruvbox syntax highlighting; the
# overrides below apply the palette to Hunk's UI and diff-specific colors.
[themes.gruvbox-dark]
base = "gruvbox-dark-hard"
label = "Gruvbox Dark"
background = "#282828"
panel = "#3c3836"
panelAlt = "#504945"
border = "#665c54"
accent = "#d79921"
accentMuted = "#7c6f64"
text = "#ebdbb2"
muted = "#a89984"
addedBg = "#32361a"
removedBg = "#3c1f1e"
movedAddedBg = "#2f3b2d"
movedRemovedBg = "#3b2937"
contextBg = "#282828"
addedContentBg = "#3f4a20"
removedContentBg = "#512522"
contextContentBg = "#32302f"
addedSignColor = "#b8bb26"
removedSignColor = "#fb4934"
lineNumberBg = "#32302f"
lineNumberFg = "#928374"
selectedHunk = "#504945"
badgeAdded = "#98971a"
badgeRemoved = "#cc241d"
badgeNeutral = "#7c6f64"
fileNew = "#b8bb26"
fileDeleted = "#fb4934"
fileRenamed = "#83a598"
fileModified = "#fabd2f"
fileUntracked = "#8ec07c"
noteBorder = "#d3869b"
noteBackground = "#3b2937"
noteTitleBackground = "#504945"
noteTitleText = "#fbf1c7"

